name: NativePHP Windows Acceptance
# Acceptance gate for packaged Windows installer (Slice 1.2)
on:
  workflow_run:
    workflows: ["NativePHP Windows Build"]
    types: [completed]
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test-packaged-exe:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      NATIVEPHP_SECRET: ${{ secrets.NATIVEPHP_SECRET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Generate NATIVEPHP_SECRET if not set
        shell: pwsh
        run: |
          if (-not $env:NATIVEPHP_SECRET) {
            $secret = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 32 | ForEach-Object { [char]$_ })
            echo "NATIVEPHP_SECRET=$secret" >> $env:GITHUB_ENV
          }

      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: 'npm' }

      - run: npm ci && npx playwright install --with-deps chromium

      - name: Download installer artifact (called workflow — same run as build)
        if: ${{ github.event_name != 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: nativephp-windows-installer
          path: artifacts

      - name: Download installer artifact (independent run — cross-run from trigger)
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: nativephp-windows-installer
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "artifacts" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $installer) {
            Write-Error "No installer .exe found in artifacts/"
            exit 1
          }
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          $programsDir = Join-Path $env:LOCALAPPDATA "Programs"
          $exePath = Get-ChildItem -Path $programsDir -Recurse -Filter "*.exe" | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          if (-not $exePath) {
            Write-Error "No installed .exe found under $programsDir"
            Write-Host "=== Diagnostic: contents of $programsDir ==="
            Get-ChildItem -Path $programsDir -Recurse | Select-Object -First 50 | ForEach-Object { Write-Host $_.FullName }
            Write-Host "=== Diagnostic: contents of C:\Program Files ==="
            Get-ChildItem -Path "C:\Program Files" -Recurse -Filter "*.exe" | Select-Object -First 20 | ForEach-Object { Write-Host $_.FullName }
            Write-Host "=== Diagnostic: contents of C:\Program Files (x86) ==="
            Get-ChildItem -Path "C:\Program Files (x86)" -Recurse -Filter "*.exe" | Select-Object -First 20 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          echo "NATIVEPHP_EXE_PATH=$($exePath.FullName)" >> $env:GITHUB_ENV
          echo "Found app at $($exePath.FullName)"

      - run: npx playwright test --config=playwright.nativephp.config.ts
        env: { NATIVEPHP_EXE_PATH: "${{ env.NATIVEPHP_EXE_PATH }}" }

      - name: Collect packaged-app diagnostics
        if: always()
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\trainer-desk'
          $appDir = Join-Path $installRoot 'resources\build\app'
          Write-Host "=== install root ==="
          if (Test-Path $installRoot) { Get-ChildItem $installRoot -Force | Select-Object Name | Out-String | Write-Host } else { Write-Host "MISSING: $installRoot" }
          Write-Host "=== resources/build/app top-level ==="
          if (Test-Path $appDir) { Get-ChildItem $appDir -Force | Select-Object Name | Out-String | Write-Host } else { Write-Host "MISSING: $appDir" }
          Write-Host "=== vendor/laravel server.php present ==="
          Write-Host (Test-Path (Join-Path $appDir 'vendor\laravel\framework\src\Illuminate\Foundation\resources\server.php'))
          Write-Host "=== public/index.php present ==="
          Write-Host (Test-Path (Join-Path $appDir 'public\index.php'))
          Write-Host "=== php binary ==="
          $php = Join-Path $installRoot 'resources\build\php\php.exe'
          Write-Host "php.exe present: $(Test-Path $php)"
          if (Test-Path $php) { & $php -v }
          Write-Host "=== manual: php artisan native:config (30s cap) ==="
          if (Test-Path $php) {
            $env:LARAVEL_STORAGE_PATH = Join-Path $env:APPDATA 'trainer-desk\storage'
            $env:NATIVEPHP_STORAGE_PATH = $env:LARAVEL_STORAGE_PATH
            $env:NATIVEPHP_DATABASE_PATH = Join-Path $env:APPDATA 'trainer-desk\database\database.sqlite'
            $env:NATIVEPHP_RUNNING = 'true'
            $env:APP_ENV = 'production'
            $env:APP_DEBUG = 'false'
            $cfgJob = Start-Job -ScriptBlock { param($php, $dir) Set-Location $dir; & $php artisan native:config 2>&1 | Out-String } -ArgumentList $php, $appDir
            if (Wait-Job $cfgJob -Timeout 30) { Write-Host (Receive-Job $cfgJob) } else { Write-Host 'TIMEOUT: native:config hung >30s'; Stop-Job $cfgJob }
            Remove-Job $cfgJob -Force
            Write-Host "=== manual: php artisan native:php-ini (30s cap) ==="
            $iniJob = Start-Job -ScriptBlock { param($php, $dir) Set-Location $dir; & $php artisan native:php-ini 2>&1 | Out-String } -ArgumentList $php, $appDir
            if (Wait-Job $iniJob -Timeout 30) { Write-Host (Receive-Job $iniJob) } else { Write-Host 'TIMEOUT: native:php-ini hung >30s'; Stop-Job $iniJob }
            Remove-Job $iniJob -Force
          }
          Write-Host "=== userData logs ==="
          $ud = Join-Path $env:APPDATA 'trainer-desk'
          if (Test-Path $ud) {
            Get-ChildItem $ud -Recurse -Force | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host
            Get-ChildItem $ud -Recurse -Filter *.log -Force | ForEach-Object {
              Write-Host "--- $($_.FullName) ---"
              Get-Content $_.FullName -Tail 300
            }
            New-Item -ItemType Directory -Force -Path 'appdata-dump' | Out-Null
            Copy-Item $ud -Destination 'appdata-dump\trainer-desk' -Recurse -Force
          } else {
            Write-Host "MISSING: $ud"
          }

      - name: Upload packaged-app diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-app-diagnostics
          path: appdata-dump
          if-no-files-found: ignore

  # The repo's first gate job. The other workflow jobs build and package the installer; without
  # this one, a lint or citation failure could land with every job green. It runs the same
  # `tools/gates.sh --fast` an operator runs locally, with that script's own stdin handling and
  # explicit changed-path collection. PHP 8.5 satisfies composer.json's ^8.4.1 floor and matches
  # the build workflow; `sockets` is listed because gates.sh names it as required. The PHP suite
  # is deliberately excluded (--fast): it is the tag-time checkpoint, not a per-build job.
  # A new workflow file would be invisible here: .gitignore:133 ignores /.github/. Adding the
  # job to this tracked workflow keeps the gate under version control without changing that
  # repository policy.
  gates:
    name: Repository gates (fast)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: zip, pdo_sqlite, mbstring, openssl, curl, fileinfo, tokenizer, xml, ctype, json, bcmath, intl, sockets
          tools: composer:v2

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Test-tool only: the fast gate's `verify-backdrop` step decodes the shipped plates
      # and measures their contrast. Not an application dependency, not carried by the
      # installer; pinned so a decoder change cannot read as artwork drift.
      - name: Install gate tool dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements-gates.txt

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare environment file
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .env.example ]; then cp .env.example .env; fi

      - name: Run gates
        shell: bash
        # --whole-tree-pint is the CI-only half: a fresh checkout has no diff against HEAD, so the
        # change-scoped pint set is empty and style would go unchecked on exactly the tree a merge
        # lands. Every other step is already tree-scoped (the census and untracked sweep read git
        # themselves), so --fast otherwise means the same thing locally and here.
        run: bash tools/gates.sh --fast --whole-tree-pint
