name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installer
    uses: ./.github/workflows/nativephp-windows.yml

  acceptance:
    name: Packaged app acceptance
    needs: build
    uses: ./.github/workflows/nativephp-windows-acceptance.yml
    secrets: inherit

  publish:
    name: Create GitHub Release
    needs: [build, acceptance]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: nativephp-windows-installer
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            *.exe
            *.yml
          generate_release_notes: true
