name: NativePHP Windows Packaging

on:
  workflow_dispatch:
  pull_request:
    branches:
      - worktree/cherry-pick

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, intl, sqlite3, pdo_sqlite, curl, openssl, fileinfo, zip, dom, xml

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\Composer\Cache
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare production packaging environment
        shell: pwsh
        run: |
          Copy-Item .env.example .env
          php -r "function setEnvLine(string \$path,string \$key,string \$value): void { \$content=file_get_contents(\$path); \$pattern='/^'.preg_quote(\$key,'/').'=.*/m'; if (preg_match(\$pattern,\$content) === 1) { \$content=preg_replace(\$pattern,\$key.'='.\$value,\$content,1); } else { \$content .= PHP_EOL.\$key.'='.\$value.PHP_EOL; } file_put_contents(\$path,\$content);} setEnvLine('.env','APP_ENV','production'); setEnvLine('.env','APP_DEBUG','false'); setEnvLine('.env','LOG_LEVEL','warning');"
          php artisan key:generate --force --no-interaction

      - name: Run middleware regression test
        run: php artisan test --compact --filter=NativeRequestSecretGateTest

      - name: Run frontend checks
        run: |
          npm run typecheck
          npm run build

      - name: Build NativePHP Windows installer
        run: php artisan native:build --win --x64 --no-interaction

      - name: Verify packaged environment safety
        shell: pwsh
        run: |
          $distRoot = Join-Path $PWD 'nativephp/electron/dist'
          $resourcesRoot = Join-Path $distRoot 'win-unpacked/resources'
          $directEnvPath = Join-Path $resourcesRoot 'build/app/.env'
          $envPath = $null

          if (Test-Path $directEnvPath) {
            $envPath = $directEnvPath
          } else {
            $asarPath = Join-Path $resourcesRoot 'app.asar'
            if (-not (Test-Path $asarPath)) {
              throw 'Packaged environment file was not found in win-unpacked output.'
            }

            $extractPath = Join-Path $env:RUNNER_TEMP 'nativephp-asar'
            if (Test-Path $extractPath) {
              Remove-Item -Recurse -Force $extractPath
            }

            npx --yes asar extract $asarPath $extractPath

            $extractedEnvPath = Join-Path $extractPath 'build/app/.env'
            if (-not (Test-Path $extractedEnvPath)) {
              throw 'Packaged environment file was not found after app.asar extraction.'
            }

            $envPath = $extractedEnvPath
          }

          $envMap = @{}
          foreach ($line in Get-Content $envPath) {
            if ([string]::IsNullOrWhiteSpace($line) -or $line.Trim().StartsWith('#')) {
              continue
            }

            $parts = $line.Split('=', 2)
            if ($parts.Length -eq 2) {
              $envMap[$parts[0]] = $parts[1]
            }
          }

          if (-not $envMap.ContainsKey('APP_KEY') -or [string]::IsNullOrWhiteSpace($envMap['APP_KEY'])) {
            throw 'APP_KEY is missing from the packaged environment.'
          }

          if (-not $envMap.ContainsKey('APP_DEBUG') -or $envMap['APP_DEBUG'].ToLowerInvariant() -ne 'false') {
            throw 'APP_DEBUG is not disabled in the packaged environment.'
          }

          $forbiddenKeys = @(
            'NATIVEPHP_APPLE_ID',
            'NATIVEPHP_APPLE_ID_PASS',
            'NATIVEPHP_APPLE_TEAM_ID',
            'NATIVEPHP_AZURE_PUBLISHER_NAME',
            'NATIVEPHP_AZURE_ENDPOINT',
            'NATIVEPHP_AZURE_CERTIFICATE_PROFILE_NAME',
            'NATIVEPHP_AZURE_CODE_SIGNING_ACCOUNT_NAME'
          )

          $leakedPatternKeys = $envMap.Keys | Where-Object {
            $_ -like 'AWS_*' -or
            $_ -like 'AZURE_*' -or
            $_ -like 'GITHUB_*' -or
            $_ -like 'DO_SPACES_*' -or
            $_ -like '*_SECRET' -or
            $_ -eq 'BIFROST_TOKEN' -or
            $_ -eq 'NATIVEPHP_UPDATER_PATH'
          }

          $leakedExactKeys = $forbiddenKeys | Where-Object { $envMap.ContainsKey($_) }
          $leakedKeys = @($leakedPatternKeys + $leakedExactKeys | Sort-Object -Unique)

          if ($leakedKeys.Count -gt 0) {
            throw ('Packaged environment contains forbidden keys: ' + ($leakedKeys -join ', '))
          }

      - name: Trace packaged user-data paths from NativePHP source
        shell: pwsh
        run: |
          $phpServerSource = Join-Path $PWD 'vendor/nativephp/desktop/resources/electron/electron-plugin/src/server/php.ts'
          if (-not (Test-Path $phpServerSource)) {
            throw 'NativePHP php.ts source was not found.'
          }

          $requiredSnippets = @(
            "app.getPath('userData')",
            "const storagePath = join(app.getPath('userData'), 'storage');",
            "const databasePath = join(app.getPath('userData'), 'database');",
            "const databaseFile = join(databasePath, 'database.sqlite');"
          )

          $source = Get-Content -Raw $phpServerSource
          foreach ($snippet in $requiredSnippets) {
            if (-not $source.Contains($snippet)) {
              throw ('Expected NativePHP path snippet was not found: ' + $snippet)
            }
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nativephp-windows-installer
          path: nativephp/electron/dist/*.exe
          if-no-files-found: error
