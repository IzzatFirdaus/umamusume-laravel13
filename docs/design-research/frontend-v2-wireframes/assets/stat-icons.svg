<!--
  Stat and type icons, remade as flat marks.

  The five discipline glyphs are the client's own objects and the only icons with a
  fixed identity (DESIGN-CORPUS.md:609, and the fixed assignment table at :617-635):
  running shoe (Speed), heart (Stamina), flexed arm (Power), flame (Guts),
  graduation cap (Wit). Pal is a single figure and Group is a pair, which is what the
  client's own support-card type chips wear in the measured legend row 155016.

  "Remade" is the operative word. The client's originals are small 3D renders, and
  DESIGN-CORPUS.md:607 forbids 3D renders and clip-art imitating the client's art in
  this system, and :605 forbids mixing a hairline set with a solid set. So these are
  redrawn on one 24 grid, one stroke weight, one family, in the same style as the
  navigation marks in resources/js/components/NavGlyph.vue.

  Two collisions the corpus records as UNRESOLVED are carried here unresolved rather
  than quietly fixed: Mood against the friend chip, and Fans against the group chip
  (DESIGN-CORPUS.md:630-633). Power is drawn as the arm, because the measured type
  chip is the arm (DESIGN-CORPUS.md:646-649).

  The colours live in assets/shell.css, not here, because the dark theme needs its
  own values and a sprite cannot carry both.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- Speed: the running shoe, the client's blue boot -->
  <symbol id="i-speed" viewBox="0 0 24 24">
    <path d="M3 15.5c2.2 0 3.4-.9 4.3-2.4l1-1.7 3.2 1.1.7 2.6c1.4.6 3.4 1 5.3 1.2 1.5.2 2.5.9 2.5 2 0 .6-.5 1-1.4 1H4.4c-1 0-1.4-.4-1.4-1.1Z"/>
    <path d="M8.3 11.4 6.7 7.2M11.5 12.5l-1-3.1M15 13.4l-.6-2.2"/>
  </symbol>

  <!-- Stamina: the heart, the client's red heart -->
  <symbol id="i-stamina" viewBox="0 0 24 24">
    <path d="M12 20.3S3.8 15.4 3.8 9.6a4.4 4.4 0 0 1 8.2-2.2 4.4 4.4 0 0 1 8.2 2.2c0 5.8-8.2 10.7-8.2 10.7Z"/>
  </symbol>

  <!-- Power: the flexed arm, which is the client's measured type chip glyph -->
  <symbol id="i-power" viewBox="0 0 24 24">
    <path d="M7.4 20.2v-4.9c-1.4-1-2.2-2.6-2.2-4.4V7.6a1.5 1.5 0 0 1 3 0v2.6"/>
    <path d="M8.2 10.2V6.1a1.5 1.5 0 0 1 3 0v4.1"/>
    <path d="M11.2 10.2V7a1.5 1.5 0 0 1 3 0v3.2"/>
    <path d="M14.2 10.2V8.4a1.5 1.5 0 0 1 3 0v5.3c0 3.5-2.6 6.5-6.4 6.5"/>
  </symbol>

  <!-- Guts: the flame, the client's pink flame -->
  <symbol id="i-guts" viewBox="0 0 24 24">
    <path d="M12 3.2c.6 3 2.3 4 3.6 5.6a6.4 6.4 0 1 1-7.2 9.7 5 5 0 0 1 1.5-7.1c.6 1 1.1 1.6 1.9 2 .3-3.6 1.4-6.4 3.4-8.6"/>
    <path d="M12 20.2a3.2 3.2 0 0 1-2.4-5.4c.9 1 1.5 1.2 2.4 1.3.8-1.1 1-2.3 1-3.6 1.4 1.3 2.2 2.9 2.2 4.6a3.2 3.2 0 0 1-3.2 3.1Z"/>
  </symbol>

  <!-- Wit: the graduation cap, never a brain -->
  <symbol id="i-wit" viewBox="0 0 24 24">
    <path d="M12 4 2.8 8.2 12 12.4l9.2-4.2Z"/>
    <path d="M6.4 10.4v4.8c0 1.4 2.5 2.6 5.6 2.6s5.6-1.2 5.6-2.6v-4.8"/>
    <path d="M20.4 9v5.2"/>
  </symbol>

  <!-- Pal (the client's `friend` type): a single figure, olive -->
  <symbol id="i-pal" viewBox="0 0 24 24">
    <circle cx="12" cy="7.6" r="3.4"/>
    <path d="M5.4 20.4c0-3.6 2.9-6 6.6-6s6.6 2.4 6.6 6"/>
  </symbol>

  <!-- Group (the client's `group` type): a pair of figures, green -->
  <symbol id="i-group" viewBox="0 0 24 24">
    <circle cx="9" cy="8" r="3.1"/>
    <circle cx="16.4" cy="9.4" r="2.4"/>
    <path d="M3.4 20.2c0-3.2 2.5-5.4 5.6-5.4s5.6 2.2 5.6 5.4"/>
    <path d="M14.4 20.2c0-2.2 1.1-3.8 3-3.8s3 1.6 3 3.8"/>
  </symbol>

  <!-- Skill Points: the book -->
  <symbol id="i-sp" viewBox="0 0 24 24">
    <path d="M12 6.6C10 5.1 7 4.7 4.2 5.3v13C7 17.7 10 18.1 12 19.6"/>
    <path d="M12 6.6c2-1.5 5-1.9 7.8-1.3v13C17 17.7 14 18.1 12 19.6"/>
    <path d="M12 6.6v13"/>
  </symbol>
</svg>
